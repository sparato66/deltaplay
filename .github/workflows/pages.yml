name: Оновлення та публікація Дельта Гейм
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зібрати стрічку майбутніх ігор зі Steam
        if: github.actor != 'github-actions[bot]'
        run: node scripts/fetch-upcoming.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Зберегти оновлену стрічку в репозиторії
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          if git diff --cached --quiet; then
            echo "Стрічка не змінилася"
          else
            git commit -m "Оновити стрічку майбутніх ігор"
            git push origin HEAD:main
          fi
